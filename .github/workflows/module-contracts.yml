name: Account and social module contracts

on:
  push:
    branches:
      - feature/modular-speed-camera-20261119
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/module-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib/user_account_core.dart lib/user_social_system.dart
      - run: flutter test
